<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Omni POS NiceLabel Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { width: 320px; padding: 16px; background: #0f172a; color: #f8fafc; font-size: 13px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #1e293b; }
    .logo-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
    .status-card { background: #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; }
    .status-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .status-row:last-child { margin-bottom: 0; }
    .badge { padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .badge-ok { background: #064e3b; color: #34d399; }
    .badge-warn { background: #78350f; color: #fbbf24; }
    .badge-err { background: #7f1d1d; color: #f87171; }
    .btn { width: 100%; padding: 8px 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 12px; transition: 0.15s; }
    .btn:hover { background: #1d4ed8; }
    .btn-outline { background: transparent; border: 1px solid #3b82f6; color: #60a5fa; margin-top: 8px; }
    .btn-outline:hover { background: #1e3a8a; }
    .footer { margin-top: 12px; text-align: center; font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-title">
      <span>🏷️</span>
      <span>Omni NiceLabel Bridge</span>
    </div>
    <span class="badge badge-ok">v1.0.0</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span style="color: #94a3b8;">NiceLabel Service:</span>
      <span id="nl-status" class="badge badge-warn">Checking...</span>
    </div>
    <div class="status-row">
      <span style="color: #94a3b8;">Active Tab:</span>
      <span id="tab-status" class="badge badge-ok">Ready</span>
    </div>
  </div>

  <button id="btn-test-print" class="btn">⚡ Test Sample Label Print</button>
  <button id="btn-options" class="btn btn-outline">⚙️ Configure NiceLabel Endpoint</button>

  <div class="footer">
    Omni POS • Direct Thermal Integration
  </div>

  <script src="popup.js"></script>
</body>
</html>
